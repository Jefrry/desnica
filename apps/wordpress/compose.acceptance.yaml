name: desnica-wordpress-acceptance

services:
  wordpress:
    build:
      target: wordpress-base
    ports: !override
      - "8081:80"
    environment:
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_AUTO_UPDATE_CORE', false);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('DISALLOW_FILE_MODS', true);
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes: !override
      - wordpress_data:/var/www/html
      - ./checks:/opt/resource-center-checks:ro

  ftp:
    image: docker.io/library/python:3.12-alpine
    profiles: [ftp]
    depends_on:
      wordpress:
        condition: service_healthy
    command: >-
      sh -ec 'pip install --no-cache-dir pyftpdlib==2.1.0 &&
      exec python -m pyftpdlib --interface=127.0.0.1 --port=2121
      --directory=/var/www/html/wp-content --write'
    volumes:
      - wordpress_data:/var/www/html
      - ./checks:/opt/resource-center-checks:ro
